<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoice</title>
<style>
    body { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; font-size: 12px; color: #222; margin: 0; padding: 24px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    .muted { color: #666; }
    .section-title { font-weight: bold; margin: 16px 0 4px; }
    table.header { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
    table.header td { vertical-align: top; }
    table.header td.brand { text-align: right; }
    table.header img { max-height: 64px; }
    hr { border: 0; border-top: 1px solid #bbb; margin: 16px 0; }
    table.grid { width: 100%; border-collapse: collapse; margin: 4px 0 12px; }
    table.grid th, table.grid td { border: 1px solid #bbb; padding: 6px 8px; text-align: left; font-size: 11px; }
    table.grid th { background: #ECE5B6; }
</style>
</head>
<body>

<table class="header">
    <tr>
        <td>
            <strong>Customer</strong><br>
            ####__CUSTOMER_NAME__####<br>
            ####__CUSTOMER_ADDRESS__####<br><br>
            <strong>Phone:</strong> ####__CUSTOMER_PHONE__####<br>
            <strong>Email:</strong> ####__CUSTOMER_EMAIL__####
        </td>
        <td class="brand">
            <img src="company-logo.jpg" alt=""><br>
            <span class="muted">Created on ####__INVOICE_CREATION_DATE__####</span>
        </td>
    </tr>
</table>

<hr>

<h1>Invoice</h1>

<div class="section-title">Details</div>
####__INVOICE_DETAILS__####

<div class="section-title">Items</div>
####__INVOICE_ITEMS__####

</body>
</html>
