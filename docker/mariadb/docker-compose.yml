# Standalone MariaDB service for daloRADIUS.
#
# Use this compose file when you want to run MariaDB independently
# (e.g., for TLS setup, debugging, or as an external database).
#
# Usage:
#   docker compose --project-directory . -f docker/mariadb/docker-compose.yml up -d
#
# To enable TLS, uncomment the tls.cnf and mariadb_certs volume mounts below.
# The FREERADIUS_SQL_TLS variable is consumed by FreeRADIUS's SQL client, not by MariaDB.
# Also ensure certificates exist in ./secrets/db/ (see README.md).

services:

  radius-mysql:
    image: mariadb:11.8
    container_name: radius-mysql
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-radius}
      - MYSQL_USER=${MYSQL_USER:-radius}
      - MYSQL_PASSWORD_FILE=/run/secrets/MYSQL_PASSWORD
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/MYSQL_ROOT_PASSWORD
      - FREERADIUS_SQL_TLS=${FREERADIUS_SQL_TLS:-disabled}
    ports:
      - '${MYSQL_HOST_PORT:-3306}:3306'
    volumes:
      - "../../data/mysql:/var/lib/mysql"
      # TLS: mount tls.cnf and certs (uncomment to enable):
      # - "../../docker/mariadb/tls.cnf:/etc/mysql/conf.d/tls.cnf:ro"
      # - "mariadb_certs:/etc/mysql/certs:ro"
    secrets:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_PASSWORD
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: ${MYSQL_HEALTH_START_PERIOD:-10m}
    networks:
      - radius-network

networks:
  radius-network:
    name: radius-network
    driver: bridge

secrets:
  MYSQL_ROOT_PASSWORD:
    file: ../../secrets/db/mysql_root_password
  MYSQL_PASSWORD:
    file: ../../secrets/db/mysql_password

volumes:
  mariadb_certs:
    # TLS certificates volume. Populated manually (see docker/mariadb/README.md).
    # Created automatically on first use when TLS is enabled.
    name: mariadb_certs
