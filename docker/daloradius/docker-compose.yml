# Standalone daloRADIUS web service.
#
# Use this compose file to run daloRADIUS web interface independently
# (e.g., for debugging, development, or standalone deployment).
# Includes MariaDB and FreeRADIUS automatically.
#
# Usage:
#   docker compose -f docker/daloradius/docker-compose.yml up -d
#
# Note: All relative paths use ../../ prefix (resolved from the compose file's
# directory = docker/daloradius/ -> project root). Do NOT use --project-directory
# with these files, as it changes path resolution and will break volume mounts.

include:
  - ../mariadb/docker-compose.yml
  - ../freeradius/docker-compose.yml

services:

  radius-web:
    container_name: radius-web
    build:
      context: ../..
      dockerfile: docker/daloradius/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    depends_on:
      radius-mysql:
        condition: service_healthy
      radius:
        condition: service_healthy
    ports:
      - '80:80'
      - '${DALORADIUS_OPERATORS_BIND:-0.0.0.0:8000}:8000'
    environment:
      - TZ=${TZ:-Europe/Vienna}
      - MYSQL_HOST=${MYSQL_HOST:-radius-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-radius}
      - MYSQL_USER=${MYSQL_USER:-radius}
      - MYSQL_PASSWORD_FILE=/run/secrets/MYSQL_PASSWORD
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/MYSQL_ROOT_PASSWORD
      - DEFAULT_CLIENT_SECRET_FILE=/run/secrets/DEFAULT_CLIENT_SECRET
      # Optional Settings:
      - DEFAULT_FREERADIUS_SERVER=${DEFAULT_FREERADIUS_SERVER:-radius}
      - DEFAULT_FREERADIUS_PORT=${DEFAULT_FREERADIUS_PORT:-1812}
      - MAIL_SMTPADDR=${MAIL_SMTPADDR:-127.0.0.1}
      - MAIL_PORT=${MAIL_PORT:-25}
      - MAIL_FROM=${MAIL_FROM:-root@daloradius.example.com}
      - MAIL_AUTH=${MAIL_AUTH:-}
      - PASSWORD_MIN_LENGTH=${PASSWORD_MIN_LENGTH:-}
      - PASSWORD_MAX_LENGTH=${PASSWORD_MAX_LENGTH:-}
    volumes:
      - ../../data/daloradius:/data
      - ../../logs/freeradius:/var/log/freeradius
      - ../../logs/daloradius:/var/www/daloradius/var/log
    secrets:
      - MYSQL_PASSWORD
      - MYSQL_ROOT_PASSWORD
      - DEFAULT_CLIENT_SECRET
    networks:
      - radius-network

networks:
  radius-network:
    name: radius-network
    driver: bridge

secrets:
  MYSQL_ROOT_PASSWORD:
    file: ../../secrets/db/mysql_root_password
  MYSQL_PASSWORD:
    file: ../../secrets/db/mysql_password
  DEFAULT_CLIENT_SECRET:
    file: ../../secrets/daloradius/daloradius_client_secret
